<!DOCTYPE html>
<html lang="eng"></html>
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Color Palette Generator</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
</head>

<body>
<div class="container">
    <h1>Color Palette Generator</h1>
        <div id="inset">
        <div class="input">
            <label for="number-colors-input">Number of Colors</label>
            <input type="number" id="number-colors-input" value="5" min="1" max="5">
        </div>
        <div class="input">
            <label for="color-format-input">Color Format:</label>
            <select id="color-format-input">
                <option value="hex">HEX</option>
                <option value="rbg">RGB</option>
                <option value="hsl">HSL</option>
            </select>
        </div>
        <div class = "input">
            <label for="color-scheme-input">Color Scheme</label>
            <select id="color-scheme-input">
                <option value="complementary">Complementary</option>
                <option value="monochromatic">Monochromatic</option>
                <option value="triadic">Triadic</option>
                <option value="tetradic">Tetradic</option>
            </select>
        </div>
    </div>
</body>
